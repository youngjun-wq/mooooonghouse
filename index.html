<!DOCTYPE html>
<html class="light" lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Gaegu:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = { darkMode: "class", theme: { extend: { colors: {
    "on-primary-container": "#4c0021", "on-secondary-fixed": "#59222d", "primary-fixed-dim": "#ff5290",
    "on-error": "#ffefef", "surface-container-high": "#eae0e2", "surface-dim": "#dcd2d4",
    "secondary-fixed": "#ffc2c9", "tertiary-fixed-dim": "#e9cacd", "secondary-fixed-dim": "#ffaeb9",
    "surface-container-lowest": "#ffffff", "surface": "#fdf4f5", "tertiary-fixed": "#f8d8db",
    "error-dim": "#a70138", "tertiary-dim": "#604a4d", "on-background": "#322e2f",
    "tertiary": "#6d5658", "on-secondary-fixed-variant": "#7c3d48", "error-container": "#f74b6d",
    "tertiary-container": "#f8d8db", "background": "#fdf4f5", "on-error-container": "#510017",
    "surface-bright": "#fdf4f5", "on-secondary": "#ffeff0", "secondary-container": "#ffc2c9",
    "on-tertiary-fixed-variant": "#6b5457", "primary": "#b50058", "primary-fixed": "#ff709e",
    "on-tertiary-fixed": "#4d383b", "primary-dim": "#9f004d", "on-surface": "#322e2f",
    "surface-container": "#efe6e7", "inverse-on-surface": "#a29b9c", "surface-container-highest": "#e4dadc",
    "on-primary": "#ffeff1", "surface-tint": "#b50058", "inverse-surface": "#100d0e",
    "secondary": "#894853", "outline-variant": "#b3abac", "error": "#b41340",
    "surface-variant": "#e4dadc", "on-primary-fixed": "#000000", "inverse-primary": "#ff4a8d",
    "primary-container": "#ff709e", "on-tertiary-container": "#614a4d", "on-primary-fixed-variant": "#5d002a",
    "on-secondary-container": "#71343f", "on-tertiary": "#ffeff0", "on-surface-variant": "#5f5a5b",
    "secondary-dim": "#7b3c47", "outline": "#7b7576", "surface-container-low": "#f8eff0"
  }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
  fontFamily: { "headline": ["Epilogue"], "body": ["Plus Jakarta Sans"], "label": ["Plus Jakarta Sans"], "cute": ["Gaegu"] } } } }
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  body { min-height: 100dvh; }
  #page-content { animation: fadeIn 0.2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .spinner { width: 28px; height: 28px; border: 3px solid #ffc2c9; border-top-color: #b50058; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 4rem auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .nav-item { transition: all 0.2s; }
  .nav-item.active { background: linear-gradient(135deg, #b50058, #ff709e); color: white !important; border-radius: 9999px; padding: 0.75rem; margin-bottom: 0.25rem; }
  .nav-item.active .nav-label { margin-top: 0.125rem; }
  .nav-item:not(.active) { color: #b3abac; }
  .nav-item:not(.active):hover { color: #b50058; }
</style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container">

<header class="fixed top-0 w-full z-50 bg-[#fdf4f5]/70 backdrop-blur-xl flex justify-between items-center px-6 h-16 border-b border-primary/5">
  <h1 class="text-2xl font-black text-[#b50058] italic font-['Epilogue'] tracking-tighter">보드방정</h1>
</header>

<main id="page-content" class="pt-20 pb-28 px-4 max-w-lg mx-auto">
  <div class="spinner"></div>
</main>

<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-2 bg-[#fdf4f5] rounded-t-[3rem] z-50 shadow-[0_-4px_30px_rgba(181,0,88,0.06)] border-t border-primary/5">
  <button onclick="navigateTo('Home')" class="nav-item active flex flex-col items-center justify-center active:scale-90" id="nav-Home"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">home</span><span class="nav-label font-['Plus_Jakarta_Sans'] text-[10px] font-bold uppercase tracking-widest">Home</span></button>
  <button onclick="navigateTo('Calendar')" class="nav-item flex flex-col items-center justify-center p-2 active:scale-90" id="nav-Calendar"><span class="material-symbols-outlined">calendar_today</span><span class="nav-label font-['Plus_Jakarta_Sans'] text-[10px] font-bold uppercase tracking-widest mt-1">Calendar</span></button>
  <button onclick="navigateTo('Board')" class="nav-item flex flex-col items-center justify-center p-2 active:scale-90" id="nav-Board"><span class="material-symbols-outlined">dashboard</span><span class="nav-label font-['Plus_Jakarta_Sans'] text-[10px] font-bold uppercase tracking-widest mt-1">Board</span></button>
  <button onclick="navigateTo('Rules')" class="nav-item flex flex-col items-center justify-center p-2 active:scale-90" id="nav-Rules"><span class="material-symbols-outlined">gavel</span><span class="nav-label font-['Plus_Jakarta_Sans'] text-[10px] font-bold uppercase tracking-widest mt-1">Rules</span></button>
</nav>

<script>
  var currentPage = 'Home';
  var pageCache   = {};
  function navigateTo(pageName) {
    if (pageName === currentPage) return;
    document.querySelectorAll('.nav-item').forEach(function(el) {
      el.classList.remove('active');
      var label = el.querySelector('.nav-label');
      if (label) { label.style.marginTop = '0.25rem'; }
    });
    var activeNav = document.getElementById('nav-' + pageName);
    if (activeNav) {
      activeNav.classList.add('active');
      var lbl = activeNav.querySelector('.nav-label');
      if (lbl) lbl.style.marginTop = '0.125rem';
    }
    currentPage = pageName;
    if (pageCache[pageName] && pageName !== 'Calendar' && pageName !== 'Board') {
      renderPage(pageCache[pageName]);
      return;
    }
    document.getElementById('page-content').innerHTML = '<div class="spinner"></div>';
    google.script.run
      .withSuccessHandler(function(html) {
        pageCache[pageName] = html;
        renderPage(html);
      })
      .getPageContent(pageName);
  }
  function renderPage(html) {
    var el = document.getElementById('page-content');
    el.innerHTML = html;
    el.querySelectorAll('script').forEach(function(oldScript) {
      var newScript = document.createElement('script');
      newScript.text = oldScript.text;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  window.addEventListener('load', function() {
    google.script.run.withSuccessHandler(function(html) { pageCache['Home'] = html; renderPage(html); }).getPageContent('Home');
  });
</script>
</body>
</html>
