<div class="space-y-4">
  <section class="bg-white rounded-xl p-5 border border-surface-container-highest shadow-sm">
    <h3 class="font-headline font-black text-primary flex items-center gap-2 mb-1"><span class="material-symbols-outlined text-xl">edit_note</span> 새 글 작성</h3>
    <p class="text-[12px] text-outline-variant mb-3 font-medium">익명으로 자유롭게 의견을 주고 받을 수 있습니다.</p>
    <div class="space-y-3">
      <textarea id="post-input" rows="3" placeholder="자유롭게 이야기를 나눠보세요 💬" class="w-full rounded-xl border border-surface-container-high bg-surface-container-lowest text-on-surface text-sm p-3 resize-none focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary placeholder:text-outline-variant transition-all"></textarea>
      <div class="flex justify-between items-center gap-3">
        <span id="post-char" class="text-[11px] text-outline-variant whitespace-nowrap">0 / 200</span>
        <input type="password" id="post-pwd" placeholder="비밀번호(수정/삭제용)" class="flex-1 text-[12px] rounded border-surface-container-high p-2 focus:ring-primary/30">
        <button onclick="boardSubmit()" class="flex items-center gap-1.5 bg-primary text-on-primary text-sm font-bold px-4 py-2 rounded-full hover:bg-primary-dim active:scale-95 transition-all shadow-sm whitespace-nowrap"><span class="material-symbols-outlined text-base">send</span> 게시</button>
      </div>
      <p id="post-error" class="text-[11px] text-error hidden"></p>
    </div>
  </section>

  <section class="bg-white rounded-xl p-5 border border-surface-container-highest shadow-sm">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-headline font-black text-primary flex items-center gap-2"><span class="material-symbols-outlined text-xl">forum</span> 전체 게시물</h3>
      <button onclick="boardLoad()" class="material-symbols-outlined text-outline hover:text-primary transition-colors text-xl">refresh</button>
    </div>
    <ul id="board-list" class="space-y-3"><li class="animate-pulse h-16 bg-surface-container-low rounded-xl"></li></ul>
  </section>
</div>

<script>
var boardPosts = [];
function boardTimeAgo(isoStr) { var diff = Math.round((Date.now() - new Date(isoStr)) / 60000); if (diff < 1) return '방금 전'; if (diff < 60) return diff + '분 전'; var h = Math.round(diff / 60); if (h < 24) return h + '시간 전'; return Math.round(h / 24) + '일 전'; }

function boardRender(posts) {
  boardPosts = posts || []; var el = document.getElementById('board-list');
  if (boardPosts.length === 0) { el.innerHTML = '<li class="text-sm text-outline text-center py-6">아직 게시물이 없어요. 첫 글을 남겨보세요! 🌸</li>'; return; }
  el.innerHTML = boardPosts.map(function(p) {
    var commentsHtml = (p.comments || []).map(function(c) { return '<div class="text-[12px] bg-surface rounded px-2 py-1.5 mt-1 border-l-2 border-primary-container"><span class="text-on-surface">' + escapeHtml(c.content) + '</span></div>'; }).join('');
    var editedTag = p.isEdited ? '<span class="text-[10px] text-outline-variant ml-1">(수정됨)</span>' : '';

    return '<li class="p-4 bg-surface-container-lowest rounded-xl border border-surface-container-high shadow-sm">' +
      '<div id="post-content-wrap-' + p.id + '" ondblclick="openEditPost(' + p.id + ')" class="cursor-pointer group relative">' +
        '<p class="text-sm text-on-surface leading-relaxed mb-3 whitespace-pre-wrap">' + escapeHtml(p.content) + editedTag + '</p>' +
        '<span class="absolute top-0 right-0 text-[10px] text-outline opacity-0 group-hover:opacity-100 transition-opacity hidden sm:block">더블클릭 수정/삭제</span>' +
      '</div>' +
      '<div class="flex items-center justify-between mb-2">' +
        '<span class="text-[11px] text-outline-variant">' + boardTimeAgo(p.timestamp) + '</span>' +
        '<button onclick="boardLike(' + p.id + ', this)" class="flex items-center gap-1 text-[11px] font-bold text-outline hover:text-primary transition-colors"><span class="material-symbols-outlined text-base">favorite_border</span><span id="like-count-' + p.id + '">' + (p.likes || 0) + '</span></button>' +
      '</div>' +
      '<div class="border-t border-surface-container-low pt-2">' + commentsHtml + '<div class="flex gap-2 mt-2"><input type="text" id="comment-input-' + p.id + '" placeholder="코멘트 달기" class="flex-1 text-[11px] rounded bg-surface border-transparent focus:ring-1 focus:ring-primary/30 p-1.5 px-3"><button onclick="boardComment(' + p.id + ')" class="text-[11px] bg-secondary-container text-on-secondary-container px-3 rounded font-bold hover:opacity-80">등록</button></div></div>' +
    '</li>';
  }).join('');
}

function openEditPost(id) {
  var post = boardPosts.find(function(p) { return p.id === id; }); if (!post) return;
  var wrapEl = document.getElementById('post-content-wrap-' + id); if (wrapEl.querySelector('textarea')) return; 
  var originalHTML = wrapEl.innerHTML;
  
  wrapEl.innerHTML = 
    '<textarea id="edit-input-' + id + '" class="w-full rounded border border-surface-container-high bg-surface-container-lowest text-on-surface text-sm p-2 resize-none" rows="3">' + post.content + '</textarea>' +
    '<div class="flex gap-2 mt-2">' +
      '<input type="password" id="edit-pwd-' + id + '" placeholder="비밀번호" class="flex-1 text-[11px] rounded border-surface-container-high p-1.5">' +
      '<button onclick="deleteEditPost(' + id + ')" class="text-[11px] px-3 py-1 bg-error text-white rounded font-bold">삭제</button>' +
      '<button onclick="submitEditPost(' + id + ')" class="text-[11px] px-3 py-1 bg-primary text-white rounded font-bold">저장</button>' +
      '<button onclick="cancelEditPost(' + id + ', \'' + encodeURIComponent(originalHTML) + '\')" class="text-[11px] px-3 py-1 bg-surface-container-high text-on-surface rounded font-bold">취소</button>' +
    '</div>';
}

function cancelEditPost(id, encodedHTML) { document.getElementById('post-content-wrap-' + id).innerHTML = decodeURIComponent(encodedHTML); }

function submitEditPost(id) {
  var content = document.getElementById('edit-input-' + id).value.trim(); var pwd = document.getElementById('edit-pwd-' + id).value;
  if (!content) { alert('내용을 입력해 주세요.'); return; } if (!pwd) { alert('비밀번호를 입력해 주세요.'); return; }
  google.script.run.withSuccessHandler(function(res) { if (res.success) boardLoad(); else alert(res.message); }).updatePost(id, content, pwd);
}

function deleteEditPost(id) {
  var pwd = document.getElementById('edit-pwd-' + id).value;
  if (!pwd) { alert('비밀번호를 입력해 주세요.'); return; } if (!confirm('이 게시물을 삭제할까요?')) return;
  google.script.run.withSuccessHandler(function(res) { if (res.success) boardLoad(); else alert(res.message); }).deletePost(id, pwd);
}

function boardLoad() { document.getElementById('board-list').innerHTML = '<li class="animate-pulse h-16 bg-surface-container-low rounded-xl"></li>'.repeat(3); google.script.run.withSuccessHandler(boardRender).getPosts(); }

function boardSubmit() {
  var input = document.getElementById('post-input'); var pwdInput = document.getElementById('post-pwd'); var errorEl = document.getElementById('post-error');
  var content = input.value.trim(); var pwd = pwdInput.value; errorEl.classList.add('hidden');
  if (!content) { errorEl.textContent = '내용을 입력하세요.'; errorEl.classList.remove('hidden'); return; }
  if (!pwd) { errorEl.textContent = '비밀번호를 입력하세요.'; errorEl.classList.remove('hidden'); return; }
  if (content.length > 200) { errorEl.textContent = '200자 이내로 입력하세요.'; errorEl.classList.remove('hidden'); return; }

  var btn = document.querySelector('[onclick="boardSubmit()"]'); btn.disabled = true; btn.textContent = '게시 중...';
  google.script.run.withSuccessHandler(function(result) {
    btn.disabled = false; btn.innerHTML = '<span class="material-symbols-outlined text-base">send</span> 게시';
    if (result.success) { input.value = ''; pwdInput.value = ''; document.getElementById('post-char').textContent = '0 / 200'; boardLoad(); } 
    else { errorEl.textContent = result.message || '게시 실패'; errorEl.classList.remove('hidden'); }
  }).addPost(content, pwd);
}

function boardLike(postId, btn) { btn.disabled = true; google.script.run.withSuccessHandler(function(result) { if (result.success) { document.getElementById('like-count-' + postId).textContent = result.likes; btn.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1"; btn.style.color = '#b50058'; } }).likePost(postId); }
function boardComment(postId) { var input = document.getElementById('comment-input-' + postId); var content = input.value.trim(); if (!content) return; input.disabled = true; google.script.run.withSuccessHandler(function() { boardLoad(); }).addComment(postId, content); }
function escapeHtml(str) { return str.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>'); }
document.getElementById('post-input').addEventListener('input', function() { var len = this.value.length; document.getElementById('post-char').textContent = len + ' / 200'; document.getElementById('post-char').style.color = len > 200 ? '#b41340' : ''; });

boardLoad();
</script>
