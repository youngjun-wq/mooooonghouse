<style>
  .cal-day { min-height: 36px; }
  .cal-day.has-event::after { content: ''; display: block; width: 4px; height: 4px; background: #b50058; border-radius: 50%; margin: 2px auto 0; }
  .cal-day.today .day-num { background: #b50058; color: white; border-radius: 9999px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
  .cal-day.selected .day-num { background: #ff709e; color: white; border-radius: 9999px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
</style>

<div class="space-y-6">
  <section class="bg-white rounded-xl p-5 border border-surface-container-highest shadow-sm">
    <div class="flex justify-between items-center mb-5">
      <button onclick="calShift(-1)" class="material-symbols-outlined text-outline hover:text-primary transition-colors p-1">chevron_left</button>
      <h2 id="cal-header" class="font-headline font-black text-primary text-lg"></h2>
      <button onclick="calShift(+1)" class="material-symbols-outlined text-outline hover:text-primary transition-colors p-1">chevron_right</button>
    </div>
    <div class="grid grid-cols-7 gap-y-1" id="cal-grid"></div>
  </section>

  <section class="bg-white rounded-xl p-5 border border-surface-container-highest shadow-sm">
    <div class="flex justify-between items-center mb-4 border-b border-surface-container-low pb-2">
      <h3 class="font-headline font-black text-primary flex items-center gap-2"><span class="material-symbols-outlined text-xl">event</span> <span id="cal-event-title">이번 달 일정</span></h3>
      <button id="add-event-btn" onclick="toggleEventForm()" class="hidden text-[11px] bg-primary text-white px-3 py-1 rounded-full font-bold shadow-sm">일정 추가하기</button>
    </div>
    
    <div id="add-event-form" class="hidden space-y-2 mb-4 bg-surface rounded-lg p-3 border border-surface-container-high">
      <input type="text" id="ev-title" placeholder="일정 제목" class="w-full border-0 focus:ring-2 focus:ring-primary/30 rounded p-2 text-sm bg-white">
      <textarea id="ev-content" placeholder="일정 상세 내용" rows="2" class="w-full border-0 focus:ring-2 focus:ring-primary/30 rounded p-2 text-sm bg-white resize-none"></textarea>
      <input type="password" id="ev-pwd" placeholder="수정/삭제용 비밀번호 (4자리)" class="w-full border-0 focus:ring-2 focus:ring-primary/30 rounded p-2 text-sm bg-white">
      <div class="flex gap-2">
        <button onclick="toggleEventForm()" class="w-1/4 bg-surface-container-high text-on-surface font-bold rounded py-1.5 text-sm hover:opacity-80">취소</button>
        <button id="del-ev-btn" onclick="deleteEvent()" class="hidden w-1/4 bg-error text-white font-bold rounded py-1.5 text-sm hover:opacity-80">삭제</button>
        <button id="submit-ev-btn" onclick="submitEvent()" class="flex-1 bg-primary-container text-on-primary-container font-bold rounded py-1.5 text-sm hover:opacity-80">저장</button>
      </div>
    </div>

    <div id="cal-events" class="space-y-3"><div class="animate-pulse h-14 bg-surface-container-low rounded-lg"></div></div>
  </section>
</div>

<script>
var allEvents = []; var calYear = new Date().getFullYear(); var calMonth = new Date().getMonth(); var selectedDateStr = null; var editingEventId = null;
var MONTHS_KO = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

function calRender() {
  var today = new Date(); document.getElementById('cal-header').textContent = calYear + '년 ' + MONTHS_KO[calMonth];
  var firstDay = new Date(calYear, calMonth, 1).getDay(); var lastDate = new Date(calYear, calMonth + 1, 0).getDate();
  var eventDays = {};
  allEvents.forEach(function(ev) { var d = new Date(ev.date); if (d.getFullYear() === calYear && d.getMonth() === calMonth) eventDays[d.getDate()] = true; });

  var html = '<div class="text-[10px] font-black text-red-400 text-center uppercase mb-2">일</div><div class="text-[10px] font-black text-on-surface-variant text-center uppercase mb-2">월</div><div class="text-[10px] font-black text-on-surface-variant text-center uppercase mb-2">화</div><div class="text-[10px] font-black text-on-surface-variant text-center uppercase mb-2">수</div><div class="text-[10px] font-black text-on-surface-variant text-center uppercase mb-2">목</div><div class="text-[10px] font-black text-on-surface-variant text-center uppercase mb-2">금</div><div class="text-[10px] font-black text-blue-400 text-center uppercase mb-2">토</div>';
  for (var i = 0; i < firstDay; i++) html += '<div></div>';
  for (var day = 1; day <= lastDate; day++) {
    var isToday = (today.getFullYear() === calYear && today.getMonth() === calMonth && today.getDate() === day);
    var dayStr = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    var isSel = (selectedDateStr === dayStr); var hasEv = eventDays[day] ? ' has-event' : '';
    var col = (firstDay + day - 1) % 7; var textColor = col === 0 ? 'text-red-400' : col === 6 ? 'text-blue-400' : 'text-on-surface';
    html += '<div class="cal-day' + hasEv + (isToday ? ' today' : '') + (!isToday && isSel ? ' selected' : '') + ' text-center text-sm cursor-pointer hover:opacity-70 transition-opacity ' + textColor + '" onclick="calSelectDay(' + day + ')"><span class="day-num">' + day + '</span></div>';
  }
  document.getElementById('cal-grid').innerHTML = html;
  
  if(selectedDateStr && parseInt(selectedDateStr.split('-')[1]) === calMonth+1) { renderEventList(allEvents.filter(function(ev) { return ev.date === selectedDateStr; }), true); }
  else { renderEventList(allEvents.filter(function(ev) { var d = new Date(ev.date); return d.getFullYear() === calYear && d.getMonth() === calMonth; }), false); }
}

function calSelectDay(day) { selectedDateStr = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(day).padStart(2,'0'); calRender(); document.getElementById('cal-event-title').textContent = calYear + '년 ' + (calMonth + 1) + '월 ' + day + '일 일정'; document.getElementById('add-event-btn').classList.remove('hidden'); resetEventForm(); }
function calShift(dir) { selectedDateStr = null; calMonth += dir; if (calMonth < 0) { calMonth = 11; calYear--; } if (calMonth > 11) { calMonth = 0; calYear++; } calRender(); document.getElementById('cal-event-title').textContent = '이번 달 일정'; document.getElementById('add-event-btn').classList.add('hidden'); resetEventForm(); }

function renderEventList(events, forDay) {
  var el = document.getElementById('cal-events');
  if (!events || events.length === 0) { el.innerHTML = '<p class="text-sm text-outline text-center py-4">' + (forDay ? '이 날은 일정이 없어요 🌸' : '이번 달 일정이 없습니다.') + '</p>'; return; }
  var monthsShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  el.innerHTML = events.map(function(ev) {
    var d = new Date(ev.date); var editedTag = ev.isEdited ? '<span class="text-[9px] text-outline-variant font-normal ml-1">(수정됨)</span>' : '';
    return '<div onclick="openEditEvent(' + ev.id + ')" class="cursor-pointer flex items-center gap-4 p-3 bg-surface-container-lowest rounded-lg border-l-4 border-primary shadow-sm hover:bg-surface transition-colors">' +
      '<div class="text-center min-w-[40px]"><div class="text-[10px] font-black text-primary uppercase leading-none">' + monthsShort[d.getMonth()] + '</div><div class="text-lg font-black text-on-surface-variant leading-none">' + d.getDate() + '</div></div>' +
      '<div class="flex-1"><h4 class="text-sm font-bold text-on-surface">' + ev.title + editedTag + '</h4><p class="text-[11px] text-on-surface-variant">' + ev.content + '</p></div></div>';
  }).join('');
}

function resetEventForm() { editingEventId = null; document.getElementById('ev-title').value = ''; document.getElementById('ev-content').value = ''; document.getElementById('ev-pwd').value = ''; document.getElementById('submit-ev-btn').textContent = '저장'; document.getElementById('del-ev-btn').classList.add('hidden'); document.getElementById('add-event-form').classList.add('hidden'); }
function toggleEventForm() { var form = document.getElementById('add-event-form'); if (form.classList.contains('hidden')) { resetEventForm(); form.classList.remove('hidden'); } else { resetEventForm(); } }

function openEditEvent(id) {
  var ev = allEvents.find(function(e) { return e.id === id; });
  if(ev) { editingEventId = id; document.getElementById('ev-title').value = ev.title; document.getElementById('ev-content').value = ev.content || ''; document.getElementById('ev-pwd').value = ''; document.getElementById('submit-ev-btn').textContent = '수정 저장'; document.getElementById('del-ev-btn').classList.remove('hidden'); document.getElementById('add-event-form').classList.remove('hidden'); }
}

function submitEvent() {
  var title = document.getElementById('ev-title').value.trim(); var content = document.getElementById('ev-content').value.trim(); var pwd = document.getElementById('ev-pwd').value;
  if(!title) { alert('제목을 입력하세요!'); return; } if(!pwd) { alert('비밀번호를 입력하세요!'); return; }
  var btn = document.getElementById('submit-ev-btn'); btn.disabled = true; btn.textContent = '처리 중...';

  if (editingEventId) {
    google.script.run.withSuccessHandler(function(res) {
      btn.disabled = false; if(res.success) { allEvents = res.events; resetEventForm(); calSelectDay(parseInt(selectedDateStr.split('-')[2])); } else { alert(res.message); btn.textContent = '수정 저장'; }
    }).updateEvent(editingEventId, title, content, pwd);
  } else {
    google.script.run.withSuccessHandler(function(events) { btn.disabled = false; allEvents = events; resetEventForm(); calSelectDay(parseInt(selectedDateStr.split('-')[2])); }).addEvent(selectedDateStr, title, content, pwd);
  }
}

function deleteEvent() {
  var pwd = document.getElementById('ev-pwd').value;
  if(!pwd) { alert('삭제하시려면 등록했던 비밀번호를 입력하세요!'); return; }
  if(!confirm('정말 삭제하시겠습니까?')) return;
  google.script.run.withSuccessHandler(function(res) {
    if(res.success) { allEvents = res.events; resetEventForm(); calSelectDay(parseInt(selectedDateStr.split('-')[2])); } else { alert(res.message); }
  }).deleteEvent(editingEventId, pwd);
}

google.script.run.withSuccessHandler(function(events) { allEvents = events || []; calRender(); }).getEvents();
</script>
