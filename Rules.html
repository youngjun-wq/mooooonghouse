<div class="space-y-5">
  <section class="bg-gradient-to-br from-primary to-primary-fixed rounded-xl p-6 text-on-primary shadow-lg relative">
    <div class="flex items-center gap-3 mb-2">
      <span class="material-symbols-outlined text-3xl" style="font-variation-settings:'FILL' 1;">gavel</span>
      <h2 class="font-headline font-black text-2xl tracking-tight">Community Rules</h2>
    </div>
    <p class="text-sm opacity-90 leading-relaxed font-medium">
      보드방정을 즐겁고 따뜻한 공간으로 만들기 위한 약속이에요.<br/>
      모든 멤버가 꼭 읽어주세요. 반영 사항이 있으시다면 방장/부방장에게 요청해주세요!
    </p>
    <button onclick="toggleEditMode()" class="absolute top-4 right-4 bg-white/20 hover:bg-white/40 p-1.5 rounded-full backdrop-blur-sm transition-colors" aria-label="전체 규칙 수정">
      <span class="material-symbols-outlined text-sm">edit</span>
    </button>
  </section>

  <section id="rules-view" class="space-y-3">
    <div class="animate-pulse h-16 bg-surface-container-low rounded-xl"></div>
  </section>

  <section id="rules-edit" class="hidden space-y-3 bg-white p-5 rounded-xl shadow-sm border border-primary/20">
    <h3 class="font-bold text-primary text-sm mb-2">전체 규칙 편집 모드</h3>
    <input type="password" id="rule-pwd" placeholder="관리자 전용 비밀번호를 입력해주세요." class="w-full text-sm border-surface-container-high rounded p-2 focus:ring-primary/50">
    <textarea id="rule-content" rows="10" placeholder="엔터를 두 번 치면(한 줄 띄우기) 규칙 번호가 나뉘어 저장됩니다." class="w-full text-sm border-surface-container-high rounded p-3 resize-none focus:ring-primary/50"></textarea>
    <div class="flex justify-end gap-2 pt-2">
      <button onclick="toggleEditMode()" class="px-4 py-2 text-sm font-bold text-outline">취소</button>
      <button onclick="saveRulesAction()" class="px-5 py-2 text-sm font-bold bg-primary text-white rounded-full hover:bg-primary-dim">저장하기</button>
    </div>
  </section>
</div>

<script>
var currentRules = [];

function loadRules() {
  google.script.run.withSuccessHandler(function(rules) {
    currentRules = rules || []; var view = document.getElementById('rules-view');
    if (currentRules.length === 0) { view.innerHTML = '<div class="bg-white rounded-xl p-5 text-center text-sm text-outline border border-surface-container-highest">등록된 룰이 없습니다. 우측 상단 펜 아이콘을 눌러 작성해 주세요!</div>'; return; }
    
    view.innerHTML = currentRules.map(function(r, i) {
      var num = String(i+1).padStart(2, '0');
      var contentText = typeof r === 'string' ? r : r.content;
      var isEdited = (typeof r === 'object' && r.isEdited) ? '<span class="text-[10px] text-outline-variant ml-2">(수정됨)</span>' : '';
      var safeText = contentText.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');
      
      return '<div id="rule-wrap-' + i + '" ondblclick="openInlineRuleEdit(' + i + ')" class="cursor-pointer bg-white rounded-xl p-5 border border-surface-container-highest shadow-sm hover:shadow-md transition-shadow relative group">' +
        '<div class="flex gap-4 items-start">' +
          '<div class="w-9 h-9 rounded-full bg-primary-container flex items-center justify-center shrink-0"><span class="text-sm font-black text-on-primary-container">' + num + '</span></div>' +
          '<p class="text-sm text-on-surface-variant leading-relaxed whitespace-pre-wrap mt-1 w-full">' + safeText + isEdited + '</p>' +
        '</div>' +
        '<span class="absolute top-2 right-3 text-[10px] text-outline opacity-0 group-hover:opacity-100 transition-opacity hidden sm:block">더블클릭 수정/삭제</span>' +
      '</div>';
    }).join('');
  }).getRules();
}

function openInlineRuleEdit(index) {
  var rule = currentRules[index];
  var contentText = typeof rule === 'string' ? rule : rule.content;
  var wrapEl = document.getElementById('rule-wrap-' + index);
  if (wrapEl.querySelector('textarea')) return; 
  var originalHTML = wrapEl.innerHTML;

  wrapEl.innerHTML = 
    '<textarea id="inline-rule-input-' + index + '" class="w-full rounded border border-surface-container-high text-sm p-2 resize-none" rows="3">' + contentText + '</textarea>' +
    '<div class="flex gap-2 mt-2">' +
      // placeholder 문구 수정
      '<input type="password" id="inline-rule-pwd-' + index + '" placeholder="관리자 전용 비밀번호를 입력해주세요." class="flex-1 text-[11px] rounded border-surface-container-high p-1.5">' +
      '<button onclick="deleteInlineRule(' + index + ')" class="text-[11px] px-3 py-1 bg-error text-white rounded font-bold">삭제</button>' +
      '<button onclick="submitInlineRule(' + index + ')" class="text-[11px] px-3 py-1 bg-primary text-white rounded font-bold">수정</button>' +
      '<button onclick="cancelInlineRule(' + index + ', \'' + encodeURIComponent(originalHTML) + '\')" class="text-[11px] px-3 py-1 bg-surface-container-high text-on-surface rounded font-bold">취소</button>' +
    '</div>';
}

function cancelInlineRule(index, encodedHTML) { document.getElementById('rule-wrap-' + index).innerHTML = decodeURIComponent(encodedHTML); }

function submitInlineRule(index) {
  var content = document.getElementById('inline-rule-input-' + index).value.trim();
  var pwd = document.getElementById('inline-rule-pwd-' + index).value;
  if (!content) { alert('내용을 입력해주세요.'); return; }
  google.script.run.withSuccessHandler(function(res) { if(res.success) loadRules(); else alert(res.message); }).updateRule(index, content, pwd);
}

function deleteInlineRule(index) {
  var pwd = document.getElementById('inline-rule-pwd-' + index).value;
  if (!confirm('이 규칙을 삭제하시겠습니까?')) return;
  google.script.run.withSuccessHandler(function(res) { if(res.success) loadRules(); else alert(res.message); }).deleteRule(index, pwd);
}

function toggleEditMode() {
  var view = document.getElementById('rules-view'); var edit = document.getElementById('rules-edit');
  if (edit.classList.contains('hidden')) {
    view.classList.add('hidden'); edit.classList.remove('hidden'); document.getElementById('rule-pwd').value = '';
    document.getElementById('rule-content').value = currentRules.map(function(r) { return typeof r === 'string' ? r : r.content; }).join('\n\n');
  } else { edit.classList.add('hidden'); view.classList.remove('hidden'); }
}

function saveRulesAction() {
  var pwd = document.getElementById('rule-pwd').value; var content = document.getElementById('rule-content').value;
  if (!pwd) { alert('비밀번호를 입력해 주세요.'); return; }
  google.script.run.withSuccessHandler(function(res) { if (res.success) { toggleEditMode(); loadRules(); } else { alert(res.message); } }).saveRules(pwd, content);
}

loadRules();
</script>
